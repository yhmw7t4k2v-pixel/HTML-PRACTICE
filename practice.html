
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>JavaScript Practice</h1>
    <p>Open Developer Tools (F12) and check the Console.</p>

    <script>
        // Declare variables
        let name = "Alexa";
        let age = 18;
        let course = "BSIT";

        // Print a sentence
        console.log("My name is " + name + ", I am " + age + " years old, and I am taking " + course + ".");

        // Create an array of favorite foods
        let favoriteFoods = ["Pizza", "Chicken", "Burger", "Sushi"];

        console.log("My favorite foods:", favoriteFoods);

        // Add one more food
        favoriteFoods.push("Ice Cream");

        // Print array length
        console.log("Number of favorite foods: " + favoriteFoods.length);

        // Check if age is greater than 18
        console.log("Is my age greater than 18? " + (age > 18));
    </script>

</body>
</html>
